{% extends 'Frontman/base.html' %}
{% load static %}

{% block content %}
<h3>Agentic</h3>
    <input type="text" id="userInput" placeholder="Type here...">
    <button onclick="sendToOllama()">Send</button>
    <p id="responseBox"></p>

    <script>
        async function sendToOllama() {
            const input = document.getElementById('userInput').value;
            document.getElementById('responseBox').innerText = "Loading...";

            try {
                const response = await fetch('http://127.0.0.1:11434/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'qwen2.5:7b', // Must match a model you have pulled
                        prompt: input,
                        stream: false
                    })
                });

                const data = await response.json();
                document.getElementById('responseBox').innerText = data.response;

            } catch (error) {
                document.getElementById('responseBox').innerText = "Connection failed. Is Ollama configured and running a model?";
            }
        }
    </script>
{% endblock %}
